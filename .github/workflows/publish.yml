name: Publish to NPM

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Decide whether to publish
        id: plan
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if npm view "n8n-nodes-browserbase@${VERSION}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "n8n-nodes-browserbase@${VERSION} is already on npm"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "${GITHUB_REF}" = "refs/heads/main" ] && ! git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "github_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "github_release=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.plan.outputs.publish == 'true'

      - run: npm run build
        if: steps.plan.outputs.publish == 'true'

      - run: npm publish --provenance --access public
        if: steps.plan.outputs.publish == 'true'

      - name: Create GitHub release
        if: steps.plan.outputs.github_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.plan.outputs.version }}" \
            --target "${GITHUB_SHA}" \
            --title "v${{ steps.plan.outputs.version }}" \
            --generate-notes
